name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new Angular release that breaks a fixture shows up before users notice.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One known place for the Angular CLIs and pnpm that angular-compat-matrix downloads, on every OS.
  ANGULAR_COMPAT_MATRIX_CACHE: ${{ github.workspace }}/../angular-compat-matrix-cache

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate workflows the way users would (npm, pnpm, with options)
        run: |
          out="$RUNNER_TEMP/generated"
          mkdir -p "$out" "$RUNNER_TEMP/pnpm-repo"
          node dist/cli.js ci github --print --cwd fixtures/libs/healthy > "$out/npm.yml"
          node dist/cli.js ci github --print --cwd fixtures/libs/healthy --versions 18-22 --next --tests \
            --build "npx ng build my-lib" --allow-scripts --step-timeout 30 > "$out/options.yml"
          cd "$RUNNER_TEMP/pnpm-repo"
          echo '{}' > ng-package.json
          echo '{ "name": "my-lib" }' > package.json
          touch pnpm-lock.yaml
          node "$GITHUB_WORKSPACE/dist/cli.js" ci github --print > "$out/pnpm.yml"
      - name: Download actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Lint this repo's workflows and the generated ones
        run: ./actionlint -color .github/workflows/*.yml "$RUNNER_TEMP"/generated/*.yml

  cases:
    name: List fixture cases
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: list
        run: echo "list=$(node test/fixtures/run.ts --list)" >> "$GITHUB_OUTPUT"

  fixtures:
    name: Fixture ${{ matrix.case }}
    needs: [unit, cases]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: fixtures
      - run: npm run build
      - name: Cache Angular CLIs and pnpm that angular-compat-matrix downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.ANGULAR_COMPAT_MATRIX_CACHE }}/tools
          key: angular-compat-matrix-tools-${{ runner.os }}-${{ github.run_id }}
          restore-keys: angular-compat-matrix-tools-${{ runner.os }}-
      - run: node test/fixtures/run.ts ${{ matrix.case }}

  # Enough on macOS and Windows to prove installs, builds, the pnpm shim and the install-script
  # default work there; the full matrix runs on Linux.
  fixtures-other-os:
    name: Fixture ${{ matrix.case }} (${{ matrix.os }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        case: [healthy-npm, healthy-pnpm, partial-too-low, tests-newer-api-pnpm, install-scripts-blocked-npm, install-scripts-blocked-pnpm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: fixtures
      - run: npm run build
      - name: Cache Angular CLIs and pnpm that angular-compat-matrix downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.ANGULAR_COMPAT_MATRIX_CACHE }}/tools
          key: angular-compat-matrix-tools-${{ runner.os }}-${{ github.run_id }}
          restore-keys: angular-compat-matrix-tools-${{ runner.os }}-
      - run: node test/fixtures/run.ts ${{ matrix.case }}

  robustness:
    name: Ctrl+C and disk full (${{ matrix.os }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: fixtures
      - run: npm run build
      - name: Ctrl+C mid-install and mid-build
        run: node test/robustness/interrupt.ts
      - name: Disk full
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/small
          sudo mount -t tmpfs -o size=150m tmpfs /mnt/small
          sudo chmod 777 /mnt/small
          SMALL_DISK=/mnt/small node test/robustness/disk-full.ts
